[project]
name = "ablekit"
version = "0.1.0"
description = "Convert Maschine expansions into Ableton Live drum racks"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.scripts]
ablekit = "ablekit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "defusedxml>=0.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ablekit"]
